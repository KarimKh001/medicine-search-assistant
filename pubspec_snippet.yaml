# Add these under "dependencies:" in your existing pubspec.yaml
# (keep the flutter: sdk: flutter line that's already there)

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.4
  http: ^1.2.2
  image_picker: ^1.1.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  easy_localization: ^3.0.7
  cached_network_image: ^3.4.1

# Add this section (or merge into existing "flutter:" section) so the
# translation JSON files are bundled into the app:

flutter:
  uses-material-design: true
  assets:
    - assets/translations/
